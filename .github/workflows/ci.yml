name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.5

jobs:
  # Required check: make it a required status check in the branch protection of `main`.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm content validate

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TODO: remove `continue-on-error` (make this job required) once the Step 5-6 PR (site
    # templates) is merged and the build passes on main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache of optimised images (astro:assets), keyed by what feeds it.
      - uses: actions/cache@v6.1.0
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'content/**/*.webp', 'content/**/*.png', 'content/**/*.jpg', 'content/**/*.jpeg') }}
          restore-keys: astro-assets-${{ runner.os }}-
      - run: pnpm build
      - run: pnpm check:build
      - run: pnpm check:parity
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: parity-report
          path: data/parity-report.md
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TODO: remove `continue-on-error` once the Step 5-6 PR (site templates) is merged and the
    # budgets in lighthouserc.json pass on the real pages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6.1.0
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'content/**/*.webp', 'content/**/*.png', 'content/**/*.jpg', 'content/**/*.jpeg') }}
          restore-keys: astro-assets-${{ runner.os }}-
      - run: pnpm build
      # The built site is served locally on :4173 (lighthouserc.json); five key pages, mobile profile
      - run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.json
